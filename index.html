<!--
  Where the data comes from
  -------------------------
  Served from pawsandtails24.com, the two scripts below read the store's own
  Storefront API at the relative path /api/<version>/graphql.json. Same origin,
  so no key, no proxy and no CORS. Served from anywhere else, set PT_API_BASE to
  something that forwards that path (dev/serve.js does it for local work).
-->
<script>
  /* Left empty on the live domain. The dev server sets it to its own origin. */
  window.PT_API_BASE = '';
  /* Only needed if the store asks for a public Storefront token. */
  window.PT_TOKEN = '';
</script>
